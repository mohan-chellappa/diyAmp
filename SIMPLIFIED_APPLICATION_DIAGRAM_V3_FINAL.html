<body>

var BLOCKS = [

  ['425,485 535,485', '#e879f9', 2.5, 0, 1],

  // Analog L/R to Amps
  ['675,130 770,130', '#10b981', 3, 0, 1],
  ['675,260 770,260', '#10b981', 3, 0, 1],

  ['370,95 370,55 745,55 745,460', '#ef4444', 2, 1, 0],

var TEXTS = [
  [195, 232, 'DIN', '#eab308', 11, 'middle'],
  [485, 80, 'BCK + LRCK (shared bus)', '#06b6d4', 11, 'start'],
  [495, 132, 'DOUT1', '#a855f7', 10, 'start'],
  [495, 252, 'DOUT2', '#a855f7', 10, 'start'],

  [338, 355, 'UART: settings', '#f8fafc', 10, 'start'],
  [555, 48, 'Amp MUTE / SD (pins TBD, if the XH-M562 exposes it)', '#ef4444', 11, 'middle'],
  [722, 122, 'analog L/R', '#10b981', 10, 'middle'],
  [722, 252, 'analog L/R', '#10b981', 10, 'middle'],
  [722, 462, 'analog L/R', '#10b981', 10, 'middle'],
  [20, 580, 'Common GND on all boards. 24 V PSU to amps; 5 V buck to Pico, Slave, DACs, ADC. Silver Dome + Piezo in direct parallel.', '#94a3b8', 11, 'start']

var LEGEND = [
  ['#06b6d4', 'BCK + LRCK'],
  ['#f97316', 'MCLK'],
  ['#a855f7', 'I2S from Pico'],
  ['#e879f9', 'I2S from slave'],
  ['#eab308', 'ADC data'],
  ['#38bdf8', 'ESP-NOW'],
  ['#f8fafc', 'UART'],

  ['#10b981', 'Analog audio'],

var CONNECTIONS = [
  ['Subsystem', 'Source Output', 'Destination Input', 'Description & Signal Type'],
  ['Analog In', 'AUX Jack / VHM-314 BT', 'Source select switch', 'Stereo line-level input (BT power isolated with B0505S)'],
  ['ADC Conversion', 'Source select', 'PCM1808 ADC', 'Stereo ADC in slave mode (MD0/MD1 set), clocks from Pico'],
  ['I2S Clocks', 'Pico GPIO 15 & 16', 'ADC, 3× DACs, Slave', 'Shared clock bus with 33-100Ω series damping resistor (R)'],
  ['MCLK Clock', 'Pico GPIO 2', 'PCM1808 SCKI', '256×fs master clock to ADC (avoids strapping pin GPIO 0)'],
  ['Digital Audio 1', 'Pico GPIO 7 (DOUT1)', 'PCM5102A DAC #1', 'Front Left & Right active 32-bit float DSP audio'],
  ['Digital Audio 2', 'Pico GPIO 6 (DOUT2)', 'PCM5102A DAC #2', 'Center (L) + Subwoofer (R) active crossover DSP audio'],
  ['Digital Audio 3', 'Slave D27 (DOUT)', 'PCM5102A DAC #3', 'Surround L & R audio + Flowing Cymbal shimmer synth'],
  ['Settings Bus', 'Pico UART TX', 'Slave UART RX (D16/D17)', 'Wired link carries volume/mute/EQ settings to prevent drift'],
  ['UI Control', '4.3B Touch HMI', 'Pico via ESP-NOW', 'Wireless Sofa Remote transmits volume, mute, delay sliders'],
  ['Amp MUTE / SD', 'Pico MUTE pin', '3× XH-M562 Mute/SD', 'Global anti-pop hardware shutdown rail (if pins exposed)'],
  ['Surround Drivers', 'Amp #3 (2×50W)', 'Silver Dome + Piezo (||)', 'Silver Dome provides 8Ω load + mids; Piezo in parallel provides ultra-high shimmer']
];

var NOTES = [
  'Surround path: raw ADC -> WROOM -> DAC #3. It adds a small fixed offset vs the mains (a few ms); absorb it in the surround delay setting.',
  'Settings flow: HMI -> Pico (ESP-NOW) -> UART -> WROOM. Both boards keep settings in flash and ramp volume over 20-50 ms.',
  'Clock wiring: star topology, 33-100 Ω series resistor (R) at the Pico, short wires. Common GND; 24 V to amps; 5 V buck to Pico, WROOM, DACs, ADC (ferrite + cap on DAC/ADC feed).',
  'Surround Hybrid: Silver Dome (4Ω/8Ω) absorbs amplifier load and delivers clear vocal/movie ambiance; Piezo disc in direct parallel provides effortless >7kHz flowing cymbal shimmer without resistors or crossover boards!'
];

// ===========================================================================
// RENDERING
// ===========================================================================
var NS = 'http://www.w3.org/2000/svg';
var svg = document.getElementById('diagram');

function svgEl(name, attrs, parent) {
  var e = document.createElementNS(NS, name);
  Object.keys(attrs || {}).forEach(function (k) { e.setAttribute(k, attrs[k]); });
  if (parent) { parent.appendChild(e); }
  return e;
}

function htmlEl(name, props, parent) {
  var e = document.createElement(name);
  Object.keys(props || {}).forEach(function (k) {
    if (k === 'text') { e.textContent = props[k]; } else if (k === 'style') { e.setAttribute('style', props[k]); } else { e.setAttribute(k, props[k]); }
  });
  if (parent) { parent.appendChild(e); }
  return e;
}

function drawBackground() {
  svgEl('rect', { x: 0, y: 0, width: 1200, height: 600, fill: '#0f172a', rx: 6 }, svg);
}

function drawMarkers(defs) {
  var seen = {};
  LINES.forEach(function (ln) {
    var c = ln[1];
    if (seen[c]) { return; }
    seen[c] = true;
    var m = svgEl('marker', { id: 'ar' + c.replace('#', ''), viewBox: '0 0 10 10', refX: 9, refY: 5, markerUnits: 'userSpaceOnUse', markerWidth: 10, markerHeight: 10, orient: 'auto-start-reverse' }, defs);
    svgEl('path', { d: 'M0,0 L10,5 L0,10 z', fill: c }, m);
  });
}

function drawLines() {
  LINES.forEach(function (ln) {
    var a = { points: ln[0], fill: 'none', stroke: ln[1], 'stroke-width': ln[2], 'stroke-linejoin': 'round' };
    if (ln[3]) { a['stroke-dasharray'] = '5 4'; }
    if (ln[4]) { a['marker-end'] = 'url(#ar' + ln[1].replace('#', '') + ')'; }
    svgEl('polyline', a, svg);
  });
}

function drawBlocks() {
  BLOCKS.forEach(function (b) {
    var x = b[0], y = b[1], w = b[2], h = b[3], isChanged = b[10];
    svgEl('rect', { x: x, y: y, width: w, height: h, fill: b[5], stroke: b[4], 'stroke-width': 2, rx: 4 }, svg);
    
    // Gold dot indicator for "changed in this version"
    if (isChanged) {
      svgEl('circle', { cx: x + w - 10, cy: y + 10, r: 4.5, fill: '#f59e0b' }, svg);
    }

    var lines = b[7].split('\n').filter(function(s){return s!=='';});
    var ty = (lines.length > 0 || b[8] !== '' || b[9] !== '') ? y + 17 : y + h / 2 + 5;
    var t = svgEl('text', { x: x + w / 2, y: ty, 'text-anchor': 'middle', 'font-size': 12, 'font-weight': 'bold', fill: b[4], 'font-family': 'Arial, sans-serif' }, svg);
    t.textContent = b[6];

    var allSubs = [];
    if (b[7] !== '') { b[7].split('\n').forEach(function(s){allSubs.push(s);}); }
    if (b[8] !== '') { b[8].split('\n').forEach(function(s){allSubs.push(s);}); }
    if (b[9] !== '') { b[9].split('\n').forEach(function(s){allSubs.push(s);}); }

    allSubs.forEach(function(s, idx) {
      var st = svgEl('text', { x: x + w / 2, y: y + 33 + idx * 13.5, 'text-anchor': 'middle', 'font-size': 10, fill: '#cbd5e1', 'font-family': 'Arial, sans-serif' }, svg);
      st.textContent = s;
    });
  });
}

function drawTexts() {
  TEXTS.forEach(function (t) {
    var e = svgEl('text', { x: t[0], y: t[1], fill: t[3], 'font-size': t[4], 'text-anchor': t[5], 'font-family': 'Arial, sans-serif' }, svg);
    e.textContent = t[2];
  });
}

function drawLegend() {
  var box = document.getElementById('legend');
  LEGEND.forEach(function (l) {
    var item = htmlEl('span', { style: 'margin-right: 16px; display: inline-block;' }, box);
    if (l[1] === 'changed in this version') {
      htmlEl('span', { 'class': 'legend-dot', style: 'background:' + l[0] + '; border-radius: 50%;' }, item);
    } else {
      htmlEl('span', { 'class': 'legend-dot', style: 'background:' + l[0] }, item);
    }
    htmlEl('span', { text: l[1] }, item);
  });
}

function drawTable() {
  var table = document.getElementById('conn-table');
  CONNECTIONS.forEach(function (row, i) {
    var tr = htmlEl('tr', {}, table);
    row.forEach(function (cell) {
      htmlEl(i === 0 ? 'th' : 'td', { text: cell }, tr);
    });
  });
}

function drawNotes() {
  var box = document.getElementById('notes');
  NOTES.forEach(function (n) {
    htmlEl('div', { text: '\u2022 ' + n }, box);
  });
}

(function init() {
  var defs = svgEl('defs', {}, svg);
  drawBackground();
  drawMarkers(defs);
  drawLines();
  drawBlocks();
  drawTexts();
  drawLegend();
  drawTable();
  drawNotes();
})();
</script>
</body>
</html>
